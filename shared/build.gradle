plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 23
        consumerProguardFiles 'ambient-consumer-rules.pro', 'wireless-consumer-rules.pro'
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-23'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    lint {
        // Legacy findings are baselined; only new findings fail the build.
        baseline = file('lint-baseline.xml')
        abortOnError = true
    }
    buildFeatures {
        // Geely/Lynk head-unit input API (com.geely.inputservice); declarations in src/main/aidl.
        aidl true
    }
    // Locally provisioned vendor SDK assets; never commit proprietary runtime binaries.
    sourceSets.main.assets.srcDir(rootProject.file('.private/vehicle-runtime-assets'))
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':pioneer-adapter')
    // PAL client SDK uses Gson through its parent classloader.
    implementation 'com.google.code.gson:gson:2.10.1'
    coreLibraryDesugaring libs.desugar.jdk.libs
    api libs.android.retrofuture
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}

// The root helper must not AOT-compile the complete application on this ARM32 head unit.
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def capitalized = variant.name.capitalize()
    def helperOutput = layout.buildDirectory.dir("generated/pioneer-hotspot-helper/${variant.name}")
    def helperClasses = layout.buildDirectory.dir("intermediates/built_in_kotlinc/${variant.name}/compile${capitalized}Kotlin/classes")
    def helperTask = tasks.register("build${capitalized}PioneerHotspotHelper", Exec) {
        dependsOn("compile${capitalized}Kotlin")
        inputs.dir(helperClasses)
        inputs.file(rootProject.file("scripts/build-pioneer-hotspot-helper.py"))
        outputs.dir(helperOutput)
        commandLine("python3", rootProject.file("scripts/build-pioneer-hotspot-helper.py").absolutePath,
            helperClasses.get().asFile.absolutePath, helperOutput.get().asFile.absolutePath)
    }
    variant.sources.assets.addStaticSourceDirectory(helperOutput.get().asFile.absolutePath)
    tasks.configureEach { task ->
        if (task.name == "merge${capitalized}Assets" ||
            (task.name.contains(capitalized) && task.name.toLowerCase().contains("lint"))) {
            task.dependsOn(helperTask)
        }
    }
}
