plugins {
    id 'com.android.library'
}

// Vendor bytes stay local. Normal Android DEX packaging replaces first-use DexClassLoader optimization.
def palSourceDex = rootProject.file('.private/vehicle-runtime-assets/vehicle/pal-client.dex')
def palRuntimeJar = rootProject.file('.private/vehicle-runtime-libs/pal-client.jar')
def sourceOnlyBuild = providers.gradleProperty('diplaySourceOnly').map { it.toBoolean() }.getOrElse(false)
def preparePalRuntime = !sourceOnlyBuild && palSourceDex.isFile() ? tasks.register('preparePioneerPalSdk', Exec) {
    inputs.file(palSourceDex)
    inputs.file(rootProject.file('scripts/prepare-pioneer-pal-sdk.py'))
    outputs.file(palRuntimeJar)
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('scripts/prepare-pioneer-pal-sdk.py').absolutePath,
        '--dex', palSourceDex.absolutePath, '--output', palRuntimeJar.absolutePath
} : null

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 23
        consumerProguardFiles 'ambient-consumer-rules.pro', 'wireless-consumer-rules.pro'
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-23'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    lint {
        // Legacy findings are baselined; only new findings fail the build.
        baseline = file('lint-baseline.xml')
        abortOnError = true
    }
    buildFeatures {
        // Geely/Lynk head-unit input API (com.geely.inputservice); declarations in src/main/aidl.
        aidl true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':pioneer-adapter')
    if (!sourceOnlyBuild && (palRuntimeJar.isFile() || preparePalRuntime != null)) {
        def runtimeFiles = files(palRuntimeJar)
        if (preparePalRuntime != null) runtimeFiles.builtBy(preparePalRuntime)
        implementation runtimeFiles
    }
    // PAL client SDK uses Gson from the application's classloader.
    implementation 'com.google.code.gson:gson:2.10.1'
    coreLibraryDesugaring libs.desugar.jdk.libs
    api libs.android.retrofuture
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
