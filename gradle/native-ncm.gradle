// Single build-time capability, shared by all consumers. Not a runtime preference.
def rawNativeNcm = providers.gradleProperty('diplay.enableNativeNcm').orElse('false').get()
if (!(rawNativeNcm in ['true', 'false'])) {
    throw new GradleException('diplay.enableNativeNcm must be exactly true or false')
}
def includeNativeNcm = rawNativeNcm == 'true'
android {
    sourceSets {
        main {
            java.srcDir(includeNativeNcm ? 'src/nativeNcm/java' : 'src/withoutNativeNcm/java')
            kotlin.srcDir(includeNativeNcm ? 'src/nativeNcm/java' : 'src/withoutNativeNcm/java')
            assets.srcDir(includeNativeNcm ? 'src/nativeNcm/assets' : 'src/withoutNativeNcm/assets')
            res.srcDir(includeNativeNcm ? 'src/nativeNcm/res' : 'src/withoutNativeNcm/res')
        }
        test {
            java.srcDir(includeNativeNcm ? 'src/nativeNcmTest/java' : 'src/withoutNativeNcmTest/java')
            kotlin.srcDir(includeNativeNcm ? 'src/nativeNcmTest/java' : 'src/withoutNativeNcmTest/java')
        }
    }
    if (project.name == 'pioneer-adapter') {
        buildFeatures { buildConfig = true }
        defaultConfig {
            buildConfigField 'boolean', 'NATIVE_NCM_INCLUDED', includeNativeNcm.toString()
            if (includeNativeNcm) consumerProguardFiles 'src/nativeNcm/consumer-rules.pro'
        }
    }
}
