name: Android checks (diplay)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all tests, lint and sample APK builds
        type: boolean
        default: true
concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select Android verification scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_VALIDATION: ${{ inputs.full_validation }}
        run: |
          if [ "$EVENT_NAME" = push ] || [ "$FULL_VALIDATION" = true ]; then
            python3 scripts/ci_android_tasks.py --full --github-output "$GITHUB_OUTPUT"
          else
            if [ "$EVENT_NAME" = pull_request ]; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            else
              BASE_SHA="$(git rev-parse HEAD^)"
            fi
            python3 scripts/ci_android_tasks.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        if: steps.scope.outputs.android == 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.10.2.4988404
      - name: Provision shared signing keystore
        if: steps.scope.outputs.android == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Set the SIGNING_KEYSTORE_BASE64 repository secret; values come from scripts/provision-signing.sh."
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > .signing/repack.keystore
          {
            echo "storeFile=.signing/repack.keystore"
            echo "storePassword=$SIGNING_KEYSTORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > .signing/signing.properties
          chmod 600 .signing/signing.properties
      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.android == 'true'
      - name: Root service and PAL packaging guards
        run: |
          node --test pioneer-adapter/src/test/js/hud-filter.test.cjs
          python3 pioneer-adapter/src/test/python/test_hud_unified_boundary.py
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror pioneer-adapter/src/main/cpp/wireless/pioneer_command_runner.c -o "$RUNNER_TEMP/diplay-command-runner"
          python3 pioneer-adapter/src/test/python/test_command_runner.py "$RUNNER_TEMP/diplay-command-runner"
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run selected Android checks
        if: steps.scope.outputs.android == 'true'
        env:
          GRADLE_TASKS: ${{ steps.scope.outputs.tasks }}
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS"
          ./gradlew -PdiplaySourceOnly=true --build-cache "${tasks[@]}" --stacktrace
      - name: Test reports
        if: always() && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pioneer-adapter/build/reports/tests/
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            common/build/reports/lint-results-debug.html
            shared/build/reports/lint-results-debug.html
            pioneer-adapter/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
