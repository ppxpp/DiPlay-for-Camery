name: Deploy DiPlay update site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-diplay-update-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            update-service/package-lock.json
            update-service/site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix update-service
          npm ci --prefix update-service/site

      - name: Check update-service
        run: |
          npm --prefix update-service test
          npm --prefix update-service run typecheck

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npm --prefix update-service run deploy
