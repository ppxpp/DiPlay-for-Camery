name: Camry adaptation regression (diplay)
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camry-adaptation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A disposable CI identity; never use the car's shared signing key here.
      ANDROID_KEYSTORE_PASSWORD: android
      ANDROID_KEY_ALIAS: adaptation-ci
      ANDROID_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.10.2.4988404
      - name: Create disposable build-check signing identity
        run: |
          CI_SIGNING_KEYSTORE="$RUNNER_TEMP/adaptation-ci.keystore"
          echo "ANDROID_KEYSTORE_PATH=$CI_SIGNING_KEYSTORE" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$CI_SIGNING_KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=DiPlay CI build checks"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared local and CI regression command
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports/vehicle-adaptation
          scripts/check_vehicle_adaptation.sh 2>&1 | tee build/reports/vehicle-adaptation/run.log
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camry-adaptation-reports
          path: |
            shared/build/test-results/testDebugUnitTest/
            shared/build/reports/tests/testDebugUnitTest/
            common/build/test-results/testDebugUnitTest/
            common/build/reports/tests/testDebugUnitTest/
            pioneer-adapter/build/test-results/testDebugUnitTest/
            pioneer-adapter/build/reports/tests/testDebugUnitTest/
            build/reports/vehicle-adaptation/
